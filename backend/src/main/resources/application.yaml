server:
  port: 9090
  servlet:
    context-path: /token-system

spring:
  application:
    name: token-Management-System

  datasource:
    url: jdbc:mysql://localhost:3306/token_display_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE